name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

  workflow_dispatch:

  # Daily rebuild so pages synced from Google Docs pick up edits to the docs
  schedule:
    - cron: "0 10 * * *" # 10 AM UTC / 5-6 AM ET

# Back-to-back pushes used to race and cancel each other's deploys
concurrency:
  group: datahub-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          lfs: false

      # R output is reused from _freeze/, so the render needs Quarto but no R.
      # Keep this version in step with the Quarto used for local renders.
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      # Refresh the pages copied from Google Docs (scripts/sync_google_docs.py).
      # The service account must be a Viewer on each doc. If the secret is
      # missing or the export fails, the committed snapshot is rendered instead.
      - name: Get a Google Drive token
        id: google_auth
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_DOCS_SA_KEY }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly

      - name: Sync Google Doc pages
        if: steps.google_auth.outputs.access_token != ''
        env:
          GOOGLE_DRIVE_TOKEN: ${{ steps.google_auth.outputs.access_token }}
        run: python3 scripts/sync_google_docs.py

      - name: Render site
        run: quarto render

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_TREE_08378F00F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/docs" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "/" # Built app content directory - optional
          skip_app_build: true # Quarto already rendered docs/ above
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_TREE_08378F00F }}
          action: "close"
