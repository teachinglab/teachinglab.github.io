project:
  type: website
  output-dir: docs
  resources: staticwebapp.config.json
  preview:
    port: 4200

website:
  title: "Data Hub"
  favicon: favicon.ico
  google-analytics: "G-2P0MJ9QPG4"
  cookie-consent: 
    type: implied
    style: simple
    palette: light
  site-url: "https://datahub.teachinglab.org/"
  description: "Website for sharing and exploring Teaching Lab data and resources."
  open-graph: true
  search: 
    show-item-context: true
  # language:
    # search-box-placeholder: Search
  page-navigation: true
  back-to-top-navigation: true
  page-footer:
    left: |
      [![](/Images/brand/tl_logo_light.png){.light-content fig-alt="Teaching Lab" width=200px}![](/Images/brand/tl_logo_dark.png){.dark-content fig-alt="Teaching Lab" width=200px}](https://www.teachinglab.org/)
      
      Teaching Lab specializes in curriculum-based professional learning, using our evidence-based model of professional learning, coined Head, Heart, Habits, and Equity. We envision a world where teachers and students thrive together in communities that enable lifelong learning and meaningful lives.
      
      Great Teachers Make The Difference: [Support Our Work.](https://www.teachinglab.org/donate)
    center:
      - text: "About"
        href: about.qmd
      - text: "FAQ"
        href: On_the_data.qmd
      - text: "License"
        href: license.qmd
      - text: "Trademark"
        href: trademark.qmd
    right:
      - icon: twitter-x
        href: https://twitter.com/teachinglabhq
        aria-label: Teaching Lab on X
      - icon: github
        href: https://github.com/teachinglabhq
        aria-label: Teaching Lab GitHub
      - icon: rss
        href: https://datahub.teachinglab.org/docs/blog/index.xml
        aria-label: TL Blog RSS
  announcement:
    icon: info-circle
    dismissable: true
    type: primary
    position: below-navbar
    content: "**FY27 is live:** the FY27 Data Collection Tracker and Project Health sheet are under *FY27 Trackers/Slides* in the menu above."
  navbar:
    left:
      - href: index.qmd
        text: Home
      - text: "FY27 Trackers/Slides"
        menu:
          - text: "FY27 Data Collection Tracker – Rostered Participants Only"
            href: https://docs.google.com/spreadsheets/d/16PLobzihuwtYfqCg0Uk1YivBcbLtOFfclualc72WVRU/edit?gid=0#gid=0
          - text: "FY27 Response Rates & Key Outcomes (Project Health)"
            href: https://docs.google.com/spreadsheets/d/1z6uPsFMz0oQN2IgMg5SwNItH8-7_YHOFirQ8ti9HmPM/edit
          - text: "Slide Deck Generator"
            href: https://tl-data.teachinglab.org/generate_slide_deck/
      - text: "Reports"
        href: Reports.qmd
      - text: "Dashboards"
        href: Dashboards.qmd
      - text: "Resources"
        menu:
          - text: "Evaluation Plan"
            href: evaluation_plan.html
          - text: "Data Dives"
            href: Data_dives.html
          - text: "On the Data"
            href: On_the_data.html
          - text: "Data Collection Overview"
            href: data_collection_overview.html
          - text: "Data Infrastructure Architecture"
            href: architecture.html
      - text: "Blog"
        href: blog.html
      - text: "Archives"
        href: archives.html
      - text: "Program FAQ"
        href: https://docs.google.com/document/d/1sBJP9Bgl-gt-_HELb9Z6QvGVjimumAWg5xRAt-bea_c/edit?tab=t.0
    right:
      - about.qmd
      - icon: github
        href: https://github.com/teachinglab/teachinglab.github.io
format:
  html:
    # Colors, fonts and logo come from _brand.yml
    theme:
      light: [brand, theme-light.scss]
      dark: [brand, theme-dark.scss]
    respect-user-color-scheme: true
    lightbox: auto
    css: styles.css
    toc: true

editor: visual

resources:
  - CNAME

execute:
  # Reuse frozen R output so CI can build the site with Quarto alone;
  # a page re-executes only when its source changes
  freeze: auto
  cache: true