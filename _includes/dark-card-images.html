<script>
// Home page cards: swap each Images/cards/*.jpg thumbnail for its *_dark.jpg
// twin whenever the site is in dark mode, and back when it isn't
(() => {
  const card_image_pattern = /Images\/cards\/([a-z_]+?)(_dark)?\.jpg$/;
  const swap_card_images = () => {
    const is_dark = document.body.classList.contains("quarto-dark");
    document.querySelectorAll("img").forEach((img) => {
      const src = img.getAttribute("src") || "";
      const match = src.match(card_image_pattern);
      if (!match) {
        return;
      }
      const wanted = src.replace(card_image_pattern, `Images/cards/${match[1]}${is_dark ? "_dark" : ""}.jpg`);
      if (wanted !== src) {
        img.setAttribute("src", wanted);
      }
    });
  };
  swap_card_images();
  new MutationObserver(swap_card_images).observe(document.body, { attributes: true, attributeFilter: ["class"] });
})();
</script>
